name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "42 9 * * *"

jobs:
  test:
    name: "test @ elixir:${{ matrix.elixir }} otp:${{ matrix.otp }} clickhouse:${{ matrix.clickhouse }} tz:${{ matrix.timezone }}${{ matrix.dialyzer && ' +dialyzer' || '' }}${{ matrix.lint && ' +lint' || '' }}"
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    strategy:
      matrix:
        include:
          # some old elixir/erlang version
          - elixir: 1.15
            otp: 25
            clickhouse: latest
            timezone: UTC

          # some recent version and non-UTC timezone
          - elixir: 1.18
            otp: 27
            clickhouse: latest
            timezone: Europe/Berlin

          # the latest elixir/erlang version with all static checks
          - elixir: ">0"
            otp: ">0"
            clickhouse: latest
            timezone: UTC
            dialyzer: true
            lint: true

          # Plausible versions
          # - https://github.com/plausible/analytics/blob/master/.tool-versions
          # - https://github.com/plausible/analytics/blob/master/.github/workflows/elixir.yml
          - elixir: 1.19.4
            otp: 27.3.4.6
            clickhouse: 25.11.5.8
            timezone: UTC

          # some older pre-JSON ClickHouse version
          # https://github.com/plausible/ch/issues/273
          - elixir: 1.18
            otp: 28
            clickhouse: 24.5.4.49
            timezone: UTC

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        ports:
          - 8123:8123
        env:
          TZ: ${{ matrix.timezone }}
          # https://github.com/ClickHouse/ClickHouse/issues/75494
          CLICKHOUSE_SKIP_USER_SETUP: 1
          options: >-
            --health-cmd nc -zw3 localhost 8124
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: test-${{ steps.beam.outputs.elixir-version }}-${{ github.head_ref || github.ref }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            test-${{ steps.beam.outputs.elixir-version }}-${{ github.head_ref || github.ref }}-
            test-${{ steps.beam.outputs.elixir-version }}-refs/heads/master-

      - run: mix deps.get --only $MIX_ENV
        if: ${{ !matrix.lint }}

      - run: mix deps.get --check-locked
        if: ${{ matrix.lint }}

      - run: mix deps.unlock --check-unused
        if: ${{ matrix.lint }}

      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted
        if: ${{ matrix.lint }}

      - run: mix test --include slow

      - name: Restore PLTs cache
        if: ${{ matrix.dialyzer }}
        uses: actions/cache@v6
        with:
          path: plts
          key: plts-${{ steps.beam.outputs.elixir-version }}-${{ github.head_ref || github.ref }}
          restore-keys: |
            plts-${{ steps.beam.outputs.elixir-version }}-refs/heads/master

      - run: mix dialyzer --format github
        if: ${{ matrix.dialyzer }}

      - uses: crate-ci/typos@master
        if: ${{ matrix.lint }}
